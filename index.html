<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>投喂朽叶模拟器</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style>
		* { box-sizing: border-box; }
		html, body { margin: 0; background: #f4eadc; }
		body { overflow: hidden; color: #4c4037; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
		#canvas { display: block; outline: none; touch-action: none; }
		#loading {
			position: fixed; inset: 0; display: grid; place-items: center;
			padding: 1rem; z-index: 1;
			background:
				repeating-linear-gradient(90deg, #c6a684 0 15px, #e3d8c2 15px 30px, #a8ae8c 30px 45px)
					bottom / 100% .65rem no-repeat,
				#f4eadc;
		}
		.card {
			width: min(100%, 27rem); padding: clamp(1rem, 4vw, 2.2rem); text-align: center;
			background: #fff9ee; border: 1px solid #ccb59b; border-radius: 1.2rem;
			box-shadow: 0 .5rem 1.6rem #5c49312b;
		}
		.portrait { width: clamp(3.8rem, 17vmin, 6.5rem); height: auto; }
		h1 { font-size: clamp(1.2rem, 4.5vw, 1.7rem); margin: .4rem 0 1rem; }
		progress {
			display: block; width: 100%; height: .85rem; overflow: hidden;
			appearance: none; border: 1px solid #c1ac91; border-radius: 999px;
			background: #e9dece; color: #687d59; accent-color: #687d59;
		}
		progress::-webkit-progress-bar { background: #e9dece; }
		progress::-webkit-progress-value { background: #687d59; border-radius: 999px; }
		progress::-moz-progress-bar { background: #687d59; border-radius: 999px; }
		#loading-note { margin: .65rem 0 0; font-size: .92rem; line-height: 1.5; }
		#retry {
			margin-top: 1rem; border: 0; border-radius: .65rem; padding: .55rem .9rem;
			background: #687d59; color: #fff9ee; font: inherit; cursor: pointer;
		}
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<canvas id="canvas">当前浏览器无法显示游戏画面。</canvas>
	<div id="loading">
		<section class="card" aria-labelledby="loading-title">
			<img class="portrait" src="index.png" alt="">
			<h1 id="loading-title">投喂朽叶模拟器</h1>
			<progress id="loading-progress" max="100" aria-label="游戏加载进度"></progress>
			<p id="loading-note" role="status" aria-live="polite">正在准备餐桌…</p>
			<button id="retry" type="button" hidden>重新加载</button>
			<noscript>请启用 JavaScript 后重新打开游戏。</noscript>
		</section>
	</div>
	<script src="index.js"></script>
	<script>
		(async function start() {
			const loading = document.getElementById("loading");
			const progress = document.getElementById("loading-progress");
			const note = document.getElementById("loading-note");
			const retry = document.getElementById("retry");
			retry.addEventListener("click", () => window.location.reload());
			try {
				const missing = Engine.getMissingFeatures({ threads: false });
				if (missing.length) {
					progress.hidden = true;
					note.textContent = "当前浏览器缺少运行游戏所需的功能，请试试新版 Chrome、Edge 或 Safari。";
					return;
				}
				const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":76113856,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
				await engine.startGame({
					onProgress(current, total) {
						if (total <= 0) return;
						const percent = Math.min(100, Math.floor(100 * current / total));
						if (progress.hasAttribute("value") && progress.value === percent) return;
						progress.value = percent;
						note.textContent = percent < 100 ? `正在准备餐桌… ${percent}%` : "餐桌准备好了，朽叶马上就到。";
					},
				});
				loading.remove();
			} catch (error) {
				console.error(error);
				progress.hidden = true;
				note.textContent = "餐桌加载中断，请检查网络后重试。";
				retry.hidden = false;
			}
		}());
	</script>
</body>
</html>
